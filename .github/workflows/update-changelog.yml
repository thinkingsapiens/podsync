name: Update changelog page

# Keeps docs/changelog.html in sync with GitHub Releases automatically —
# no manual edits needed when the source repo's release.yml publishes a
# new PodSync version here.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api repos/${{ github.repository }}/releases --paginate > /tmp/releases.json

      - name: Regenerate docs/changelog.html
        run: python3 scripts/build_changelog.py /tmp/releases.json docs/changelog.html

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/changelog.html
          git diff --cached --quiet || git commit -m "chore: update changelog page"
          git push
